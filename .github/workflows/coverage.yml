name: Coverage

on:
  workflow_call:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Generate full coverage report
        run: |
          # Generate complete coverage report - Codecov will filter via flags
          cargo llvm-cov nextest --all-features --workspace --lcov --output-path lcov.info

      - name: Display coverage summary
        run: |
          echo "=== Coverage Summary ==="
          FULL_COVERAGE=$(cargo llvm-cov nextest --all-features --workspace --summary-only | grep -oP '\d+\.\d+(?=% coverage)' || echo "0")
          echo "📊 Total Coverage: $FULL_COVERAGE%"
          echo ""
          echo "✅ Generated full coverage report"
          echo "ℹ️  Codecov will filter via flags: non-cli (80% enforced) and cli (informational)"
          echo ""

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 30

      - name: Upload coverage to Codecov with flags
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov.info
          flags: non-cli,cli
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
