name: Coverage

on:
  workflow_call:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Install lcov for filtering
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Generate full coverage report
        run: |
          # Generate complete coverage report
          cargo llvm-cov nextest --all-features --workspace --lcov --output-path lcov-full.info

      - name: Filter coverage reports
        run: |
          # Create non-CLI coverage (exclude CLI paths)
          lcov --remove lcov-full.info '*/src/cli/*' '*/src/main.rs' --output-file lcov-non-cli.info
          
          # Create CLI-only coverage (extract only CLI paths)
          lcov --extract lcov-full.info '*/src/cli/*' '*/src/main.rs' --output-file lcov-cli.info
          
          echo "Generated filtered coverage reports:"
          echo "- lcov-non-cli.info (excludes CLI)"
          echo "- lcov-cli.info (CLI only)"

      - name: Display coverage summary
        run: |
          echo "=== Coverage Summary ==="
          FULL_COVERAGE=$(cargo llvm-cov nextest --all-features --workspace --summary-only | grep -oP '\d+\.\d+(?=% coverage)' || echo "0")
          echo "📊 Total Coverage: $FULL_COVERAGE%"
          echo ""
          echo "✅ Generated separate filtered coverage reports"
          echo "ℹ️  Non-CLI coverage enforced at 80%"
          echo "ℹ️  CLI coverage tracked for informational purposes only"
          echo ""

      - name: Upload coverage reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            lcov-non-cli.info
            lcov-cli.info
          retention-days: 30

      - name: Upload non-CLI coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov-non-cli.info
          flags: non-cli
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          name: non-cli-coverage

      - name: Upload CLI coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov-cli.info
          flags: cli
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          name: cli-coverage
