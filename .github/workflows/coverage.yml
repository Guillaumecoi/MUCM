name: Coverage

on:
  workflow_call:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Generate full coverage report
        run: |
          cargo llvm-cov nextest --all-features --workspace --lcov --output-path lcov-full.info

      - name: Display coverage summary
        run: |
          echo "=== Full Coverage (All Code) ==="
          FULL_COVERAGE=$(cargo llvm-cov nextest --all-features --workspace --summary-only | grep -oP '\d+\.\d+(?=% coverage)' || echo "0")
          echo "📊 Total Coverage: $FULL_COVERAGE%"
          echo ""
          
          echo "=== Core Coverage (Excluding CLI) ==="
          # This is approximate - actual core coverage is calculated by Codecov
          echo "ℹ️  Core coverage will be calculated by Codecov based on flags"
          echo ""
          
          if (( $(echo "$FULL_COVERAGE < 60.0" | bc -l) )); then
            echo "⚠️  Overall coverage $FULL_COVERAGE% is below 60% threshold"
          else
            echo "✅ Overall coverage $FULL_COVERAGE% meets the 60% threshold"
          fi

      - name: Upload coverage reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: lcov-full.info
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov-full.info
          flags: all,core,cli
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          name: codecov-mucm
