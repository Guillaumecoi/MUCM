name: Coverage

on:
  workflow_call:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Install lcov for filtering
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Generate full coverage report
        run: |
          # Generate complete coverage report
          cargo llvm-cov nextest --all-features --workspace --lcov --output-path lcov-full.info

      - name: Filter coverage reports
        run: |
          # Create non-CLI coverage (exclude CLI paths)
          lcov --remove lcov-full.info '*/src/cli/*' '*/src/main.rs' --output-file lcov-non-cli.info
          
          echo "Generated filtered coverage report (non-CLI only)"
          lcov --summary lcov-non-cli.info

      - name: Display coverage summary
        run: |
          echo "=== Coverage Summary ==="
          echo "📊 Non-CLI Coverage (enforced at 80%)"
          lcov --summary lcov-non-cli.info 2>&1 | grep "lines\|functions"
          echo ""
          echo "ℹ️  CLI code excluded from coverage metrics"

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov-non-cli.info
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov-non-cli.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
