name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Release Binaries
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: mucm
            asset_name: mucm-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: mucm
            asset_name: mucm-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: mucm
            asset_name: mucm-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: mucm.exe
            asset_name: mucm-windows-x86_64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
          mv ${{ matrix.asset_name }}.tar.gz ../../../

      - name: Prepare artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ${{ matrix.asset_name }}.zip ${{ matrix.artifact_name }}
          mv ${{ matrix.asset_name }}.zip ../../../
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            *.tar.gz
            *.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          gh release create $VERSION \
            --title "Release $VERSION" \
            --generate-notes \
            artifacts/**/*

  publish:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check for code changes
        id: check_changes
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, assuming code changes"
            echo "has_code_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check if any non-documentation files changed
          CHANGED_FILES=$(git diff --name-only $PREV_TAG HEAD)
          CODE_CHANGES=$(echo "$CHANGED_FILES" | grep -v -E '(\.md$|^docs/|^LICENSE|^images/|^example/)' || true)
          
          if [ -z "$CODE_CHANGES" ]; then
            echo "Only documentation changed, skipping publish"
            echo "has_code_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Code changes detected, will publish"
            echo "has_code_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to crates.io
        if: steps.check_changes.outputs.has_code_changes == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

      - name: Skip publish (docs only)
        if: steps.check_changes.outputs.has_code_changes == 'false'
        run: echo "Skipping crates.io publish - only documentation changed"
