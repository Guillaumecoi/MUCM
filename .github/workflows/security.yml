name: Security Audit

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  security_audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run security audit
        id: audit
        continue-on-error: true
        run: |
          cargo audit --json > audit-results.json
          cargo audit

      - name: Check audit results
        id: check
        run: |
          if [ -f audit-results.json ]; then
            VULNERABILITIES=$(jq '.vulnerabilities.count' audit-results.json)
            if [ "$VULNERABILITIES" -gt 0 ]; then
              echo "has_vulnerabilities=true" >> $GITHUB_OUTPUT
              echo "vuln_count=$VULNERABILITIES" >> $GITHUB_OUTPUT
            else
              echo "has_vulnerabilities=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Create issue for vulnerabilities
        if: steps.check.outputs.has_vulnerabilities == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const auditResults = JSON.parse(fs.readFileSync('audit-results.json', 'utf8'));
            
            let issueBody = '## Security Vulnerabilities Detected\n\n';
            issueBody += `Found ${auditResults.vulnerabilities.count} vulnerabilities in dependencies.\n\n`;
            
            if (auditResults.vulnerabilities.list && auditResults.vulnerabilities.list.length > 0) {
              issueBody += '### Details\n\n';
              for (const vuln of auditResults.vulnerabilities.list) {
                issueBody += `#### ${vuln.advisory.title}\n`;
                issueBody += `- **Package**: ${vuln.advisory.package}\n`;
                issueBody += `- **Severity**: ${vuln.advisory.severity || 'Unknown'}\n`;
                issueBody += `- **CVE**: ${vuln.advisory.id}\n`;
                issueBody += `- **Description**: ${vuln.advisory.description}\n`;
                if (vuln.advisory.url) {
                  issueBody += `- **More Info**: ${vuln.advisory.url}\n`;
                }
                issueBody += '\n';
              }
            }
            
            issueBody += '\n---\n';
            issueBody += '*This issue was automatically created by the Security Audit workflow.*';
            
            const title = `Security: ${auditResults.vulnerabilities.count} vulnerabilit${auditResults.vulnerabilities.count === 1 ? 'y' : 'ies'} detected`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: issueBody,
              labels: ['security', 'dependencies']
            });

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-results
          path: audit-results.json
          if-no-files-found: ignore
