name: Integration Tests

on:
  workflow_call:
  push:
    branches: [ main, master]
  pull_request:
    branches: [ main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  standard-cli-test:
    name: Standard CLI Workflow Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Add binary to PATH
        run: echo "${{ github.workspace }}/target/release" >> $GITHUB_PATH

      - name: Create test workspace
        run: mkdir test-standard && cd test-standard

      # Standard CLI Flow Tests
      - name: Test 1 - Initialize project
        working-directory: test-standard
        run: |
          mucm init --storage toml --language rust --methodology developer
          if [ ! -f ".config/.mucm/mucm.toml" ]; then
            echo "ERROR: Config not created"
            exit 1
          fi
          echo "✓ Project initialized"

      - name: Test 2 - Create actors
        working-directory: test-standard
        run: |
          mucm actor create-system --actor-type system webserver "Web Server"
          mucm actor create-system --actor-type database postgres "PostgreSQL"
          mucm actor create-persona admin-user "Administrator" "System Admin"
          OUTPUT=$(mucm actor list)
          if ! echo "$OUTPUT" | grep -q "webserver"; then
            echo "ERROR: System actor not created"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -q "admin-user"; then
            echo "ERROR: Persona not created"
            exit 1
          fi
          echo "✓ Actors created"

      - name: Test 3 - Create use case
        working-directory: test-standard
        run: |
          mucm create "User Login" --category Authentication --description "User authentication workflow"
          OUTPUT=$(mucm list)
          if ! echo "$OUTPUT" | grep -q "UC-AUT-001"; then
            echo "ERROR: Use case not created"
            exit 1
          fi
          echo "✓ Use case created"

      - name: Test 4 - Add conditions
        working-directory: test-standard
        run: |
          mucm precondition add UC-AUT-001 "User has valid credentials"
          mucm postcondition add UC-AUT-001 "User session established"
          OUTPUT=$(mucm precondition list UC-AUT-001)
          if ! echo "$OUTPUT" | grep -q "valid credentials"; then
            echo "ERROR: Precondition not added"
            exit 1
          fi
          echo "✓ Conditions added"

      - name: Test 5 - Create second use case with reference
        working-directory: test-standard
        run: |
          mucm create "Password Reset" --category Authentication --description "Reset user password"
          mucm reference add UC-AUT-002 UC-AUT-001 dependency --description "Requires auth system"
          OUTPUT=$(mucm reference list UC-AUT-002)
          if ! echo "$OUTPUT" | grep -q "UC-AUT-001"; then
            echo "ERROR: Reference not added"
            exit 1
          fi
          echo "✓ References working"

      - name: Test 6 - Verify file generation
        working-directory: test-standard
        run: |
          if [ ! -f "docs/use-cases/authentication/UC-AUT-001/README.md" ]; then
            echo "ERROR: Markdown not generated"
            ls -la docs/use-cases/authentication/ || echo "Directory not found"
            ls -la docs/use-cases/authentication/UC-AUT-001/ || echo "Use case directory not found"
            exit 1
          fi
          echo "✓ Files generated"

      - name: Test 7 - Status command
        working-directory: test-standard
        run: |
          OUTPUT=$(mucm status)
          if ! echo "$OUTPUT" | grep -q "Total Use Cases"; then
            echo "ERROR: Status failed"
            exit 1
          fi
          echo "✓ Status working"

      - name: Standard CLI Summary
        if: success()
        run: |
          echo "================================"
          echo "✅ STANDARD CLI TESTS PASSED"
          echo "================================"
          echo "Tests: 7/7"
          echo "Features tested:"
          echo "  ✓ Project initialization"
          echo "  ✓ Actor creation (system + persona)"
          echo "  ✓ Use case creation"
          echo "  ✓ Conditions (pre/post)"
          echo "  ✓ References"
          echo "  ✓ File generation"
          echo "  ✓ Status display"

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-standard-artifacts
          path: test-standard/
          retention-days: 7

  sqlite-backend-test:
    name: SQLite Backend Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Add binary to PATH
        run: echo "${{ github.workspace }}/target/release" >> $GITHUB_PATH

      - name: Test 1 - Initialize with SQLite
        run: |
          mkdir test-sqlite
          cd test-sqlite
          mucm init --storage sqlite --language javascript --methodology feature
          if [ ! -f ".config/.mucm/mucm.toml" ]; then
            echo "ERROR: SQLite project not initialized"
            exit 1
          fi
          echo "✓ SQLite project initialized"

      - name: Test 2 - Create data with SQLite
        working-directory: test-sqlite
        run: |
          mucm actor create-persona user1 "Test User" "User Role"
          mucm create "Export Data" --category Data --description "CSV export"
          if [ ! -f "use-cases-data/usecases.db" ]; then
            echo "ERROR: SQLite database not created"
            ls -la use-cases-data/ || echo "Data dir not found"
            exit 1
          fi
          echo "✓ SQLite database working"

      - name: Test 3 - Verify SQLite data persistence
        working-directory: test-sqlite
        run: |
          OUTPUT=$(mucm list)
          if ! echo "$OUTPUT" | grep -q "UC-DAT-001"; then
            echo "ERROR: Data not persisted in SQLite"
            exit 1
          fi
          OUTPUT=$(mucm actor list)
          if ! echo "$OUTPUT" | grep -q "user1"; then
            echo "ERROR: Actors not persisted in SQLite"
            exit 1
          fi
          echo "✓ SQLite persistence verified"

      - name: SQLite Backend Summary
        if: success()
        run: |
          echo "================================"
          echo "✅ SQLITE BACKEND TESTS PASSED"
          echo "================================"
          echo "Tests: 3/3"
          echo "Features tested:"
          echo "  ✓ SQLite initialization"
          echo "  ✓ Database creation"
          echo "  ✓ Data persistence"

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-sqlite-artifacts
          path: test-sqlite/
          retention-days: 7

  multi-view-template-test:
    name: Multi-View Template Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Add binary to PATH
        run: echo "${{ github.workspace }}/target/release" >> $GITHUB_PATH

      - name: Test 1 - Initialize with multiple methodologies
        run: |
          mkdir test-multiview
          cd test-multiview
          mucm init --storage toml --methodology developer,tester
          if [ ! -f ".config/.mucm/mucm.toml" ]; then
            echo "ERROR: Multi-view project not initialized"
            exit 1
          fi
          echo "✓ Multi-view project initialized"

      - name: Test 2 - Verify template files copied
        working-directory: test-multiview
        run: |
          if [ ! -f ".config/.mucm/template-assets/use_case_overview.hbs" ]; then
            echo "ERROR: use_case_overview.hbs not copied"
            ls -la .config/.mucm/template-assets/ || echo "Template dir not found"
            exit 1
          fi
          if [ ! -f ".config/.mucm/template-assets/category_overview.hbs" ]; then
            echo "ERROR: category_overview.hbs not copied"
            exit 1
          fi
          echo "✓ Template files copied"

      - name: Test 3 - Create multi-view use case
        working-directory: test-multiview
        run: |
          mucm create "Multi-View Feature" --category Testing --description "Feature with multiple views" --views "developer:advanced,tester:normal"
          OUTPUT=$(mucm list)
          if ! echo "$OUTPUT" | grep -q "UC-TST-001"; then
            echo "ERROR: Multi-view use case not created"
            exit 1
          fi
          echo "✓ Multi-view use case created"

      - name: Test 4 - Verify README.md generated
        working-directory: test-multiview
        run: |
          if [ ! -f "docs/use-cases/testing/UC-TST-001/README.md" ]; then
            echo "ERROR: Use case README.md not generated"
            ls -la docs/use-cases/testing/ || echo "Category dir not found"
            ls -la docs/use-cases/testing/UC-TST-001/ || echo "Use case dir not found"
            exit 1
          fi
          echo "✓ Use case README.md generated"

      - name: Test 5 - Verify README.md content
        working-directory: test-multiview
        run: |
          README_CONTENT=$(cat docs/use-cases/testing/UC-TST-001/README.md)
          if ! echo "$README_CONTENT" | grep -q "Available Views"; then
            echo "ERROR: README.md missing Available Views section"
            cat docs/use-cases/testing/UC-TST-001/README.md
            exit 1
          fi
          if ! echo "$README_CONTENT" | grep -q "developer" || ! echo "$README_CONTENT" | grep -q "tester"; then
            echo "ERROR: README.md not listing both methodologies"
            exit 1
          fi
          echo "✓ README.md contains correct content"

      - name: Test 6 - Verify methodology view files exist
        working-directory: test-multiview
        run: |
          if [ ! -f "docs/use-cases/testing/UC-TST-001/UC-TST-001-developer-advanced.md" ]; then
            echo "ERROR: Developer view file not generated"
            ls -la docs/use-cases/testing/UC-TST-001/ || echo "Use case dir not found"
            exit 1
          fi
          if [ ! -f "docs/use-cases/testing/UC-TST-001/UC-TST-001-tester-normal.md" ]; then
            echo "ERROR: Tester view file not generated"
            exit 1
          fi
          echo "✓ Both methodology view files generated"

      - name: Test 7 - Verify category overview
        working-directory: test-multiview
        run: |
          if [ ! -f "docs/use-cases/testing/README.md" ]; then
            echo "ERROR: Category README not generated"
            ls -la docs/use-cases/ || echo "Use cases dir not found"
            exit 1
          fi
          CATEGORY_CONTENT=$(cat docs/use-cases/testing/README.md)
          if ! echo "$CATEGORY_CONTENT" | grep -q "UC-TST-001"; then
            echo "ERROR: Category README not listing use case"
            exit 1
          fi
          echo "✓ Category overview generated"

      - name: Multi-View Template Summary
        if: success()
        run: |
          echo "================================"
          echo "✅ MULTI-VIEW TEMPLATE TESTS PASSED"
          echo "================================"
          echo "Tests: 7/7"
          echo "Features tested:"
          echo "  ✓ Multi-methodology initialization"
          echo "  ✓ Template files copied (use_case_overview.hbs, category_overview.hbs)"
          echo "  ✓ Multi-view use case creation"
          echo "  ✓ Use case README.md generation"
          echo "  ✓ README.md content verification"
          echo "  ✓ Methodology view files"
          echo "  ✓ Category overview"

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-multiview-artifacts
          path: test-multiview/
          retention-days: 7
