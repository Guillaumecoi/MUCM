[package]
name = "mucm"
version = "0.2.0"
edition = "2021"
authors = ["Guillaume Coigniez <120651399+Guillaumecoi@users.noreply.github.com>"]
license = "MIT"
description = "A lightweight CLI tool for managing use cases in markdown format, designed to keep your documentation close to your code."
homepage = "https://github.com/Guillaumecoi/MUCM"
repository = "https://github.com/Guillaumecoi/MUCM"
documentation = "https://github.com/Guillaumecoi/MUCM/docs"
readme = "README.md"
keywords = ["markdown", "use-case", "documentation", "cli", "git"]
categories = ["command-line-utilities", "development-tools", "template-engine"]
include = [
    "src/**/*",
    "source-templates/**/*",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
]

[[bin]]
name = "mucm"
path = "src/main.rs"

[lib]
name = "mucm"
path = "src/lib.rs"

[dependencies]
# CLI and argument parsing
clap = { version = "4.5", features = ["derive", "color"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.9.8"

# Templating
handlebars = "6.3.2"

# File system and I/O
walkdir = "2.5"
directories = "6.0"
include_dir = "0.7"

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Regular expressions
regex = "1.12"

# SQLite database
rusqlite = { version = "0.37", features = ["bundled"] }

# Terminal UI
console = "0.16.1"
colored = "3.0"
inquire = "0.9.1"
crossterm = "0.29"

[dev-dependencies]
tempfile = "3.23"
assert_cmd = "2.1"
predicates = "3.1"
serial_test = "3.2"
criterion = { version = "0.7.0", features = ["html_reports"] }
