# Codecov configuration for MUCM
# https://docs.codecov.com/docs/codecov-yaml

# Coverage targets and thresholds
coverage:
  status:
    # Project-level coverage
    project:
      # Non-CLI coverage (all code except CLI) - This is the main metric
      default:
        target: 80%
        threshold: 2%
        flags:
          - non-cli
      
      # CLI coverage (informational only)
      cli:
        target: auto          # No specific target
        threshold: 100%       # Never fail
        informational: true   # Just show the data
        flags:
          - cli
    
    # Patch coverage (new code in PRs)
    patch:
      default:
        target: 80%         # New code must have 80% coverage
        threshold: 5%
        only_pulls: true    # Only check on pull requests

# Flag definitions for separating coverage reports
flags:
  non-cli:
    paths:
      - src/
    # Exclude CLI directory
    ignore:
      - src/cli/
      - src/main.rs
    carryforward: true
  
  cli:
    paths:
      - src/cli/
      - src/main.rs
    carryforward: true

# Comment on PRs with coverage details
comment:
  layout: "header, diff, flags, components, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  
# Ignore certain files from coverage
ignore:
  - "benches/**/*"
  - "tests/**/*"
  - "examples/**/*"
  - "target/**/*"

# Component-based coverage (optional, for detailed breakdown)
component_management:
  individual_components:
    - component_id: non-cli
      name: Non-CLI Code
      paths:
        - src/config/**
        - src/controller/**
        - src/core/**
    
    - component_id: cli
      name: CLI Interface
      paths:
        - src/cli/**
        - src/main.rs
