# Codecov configuration for MUCM
# https://docs.codecov.com/docs/codecov-yaml

# Coverage targets and thresholds
coverage:
  status:
    # Project-level coverage (non-CLI code only)
    project:
      default:
        target: 80%
        threshold: 2%
    
    # Patch coverage (new code in PRs)
    patch:
      default:
        target: 80%
        threshold: 5%
        only_pulls: true

# Component-based coverage (free plan alternative to flags)
component_management:
  individual_components:
    - component_id: non-cli
      name: Non-CLI Code
      paths:
        - src/config/**
        - src/controller/**
        - src/core/**
        - src/presentation/**

# Comment on PRs with coverage details
comment:
  layout: "header, diff, flags, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  
# Ignore certain files from coverage
ignore:
  - "benches/**/*"
  - "tests/**/*"
  - "examples/**/*"
  - "target/**/*"
