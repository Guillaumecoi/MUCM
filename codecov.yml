# Codecov configuration for MUCM
# https://docs.codecov.com/docs/codecov-yaml

# Coverage targets and thresholds
coverage:
  status:
    # Project-level coverage
    project:
      # Non-CLI coverage (all code except CLI) - This is the main metric
      default:
        target: 80%
        threshold: 2%
        flags:
          - non-cli
      
      # CLI coverage (informational only)
      cli:
        target: auto          # No specific target
        threshold: 100%       # Never fail
        informational: true   # Just show the data
        flags:
          - cli
    
    # Patch coverage (new code in PRs)
    patch:
      default:
        target: 80%         # New code must have 80% coverage
        threshold: 5%
        only_pulls: true    # Only check on pull requests

# Flag definitions for separating coverage reports
# Note: Files are pre-filtered using lcov before upload
flags:
  non-cli:
    carryforward: true
  
  cli:
    carryforward: true

# Comment on PRs with coverage details
comment:
  layout: "header, diff, flags, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  
# Ignore certain files from coverage
ignore:
  - "benches/**/*"
  - "tests/**/*"
  - "examples/**/*"
  - "target/**/*"
